<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HERMELI — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --primary: #1a1a1a;
      --accent: #b8955a;
      --accent-light: #f5efe6;
      --danger: #e53935;
      --success: #43a047;
      --muted: #888;
      --border: #e8e4df;
      --radius: 6px;
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--primary); min-height: 100vh; }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--primary);
    }
    .login-box {
      background: var(--surface); border-radius: 12px; padding: 48px 40px;
      width: 360px; max-width: 90vw; text-align: center;
    }
    .login-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; letter-spacing: 5px; margin-bottom: 6px;
    }
    .login-sub { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 36px; }
    .login-input {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 15px; font-family: 'Inter', sans-serif;
      outline: none; margin-bottom: 16px; transition: border .2s;
    }
    .login-input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%; padding: 13px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius); font-size: 14px; letter-spacing: 1px;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: background .2s;
    }
    .login-btn:hover { background: #333; }
    .login-error { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

    /* ── ADMIN PANEL ── */
    #adminPanel { display: none; }

    .admin-header {
      background: var(--primary); color: #fff;
      padding: 0 28px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .admin-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; letter-spacing: 4px; }
    .admin-header nav { display: flex; gap: 16px; align-items: center; }
    .nav-btn {
      background: none; border: none; color: #ccc; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 13px; padding: 6px 14px;
      border-radius: 20px; transition: .2s; letter-spacing: .5px;
    }
    .nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,.12); color: #fff; }
    .logout-btn {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
      color: #ccc; border-radius: 20px; padding: 6px 16px;
      font-size: 12px; cursor: pointer; font-family: 'Inter', sans-serif;
    }

    .admin-body { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* ── SECTION TABS ── */
    .section { display: none; }
    .section.active { display: block; }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; margin-bottom: 24px; font-weight: 400;
    }

    /* ── ADD PRODUCT FORM ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 28px;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1/-1; }
    label { font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    input, textarea, select {
      padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: 'Inter', sans-serif;
      outline: none; transition: border .2s; background: var(--surface);
      color: var(--primary);
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }

    /* Image input */
    .img-input-wrap { position: relative; }
    .img-preview {
      width: 100%; height: 200px; border: 2px dashed var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      color: var(--muted); cursor: pointer; transition: border .2s; overflow: hidden;
      background: var(--bg);
    }
    .img-preview:hover { border-color: var(--accent); }
    .img-preview img { width: 100%; height: 100%; object-fit: cover; }
    .img-preview input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* sizes */
    .sizes-input-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .size-tag {
      padding: 5px 12px; background: var(--primary); color: #fff;
      border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px;
    }
    .size-tag button { background: none; border: none; color: rgba(255,255,255,.7); cursor: pointer; font-size: 12px; padding: 0; }
    .size-add-input { padding: 5px 10px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; width: 80px; }
    .size-add-btn {
      padding: 5px 12px; border: 1px solid var(--border); background: none;
      border-radius: 20px; cursor: pointer; font-size: 13px;
    }

    .form-actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn-primary {
      padding: 12px 28px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius); font-size: 14px; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: background .2s; font-weight: 500;
    }
    .btn-primary:hover { background: #333; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary {
      padding: 12px 20px; background: none; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: border .2s;
    }
    .btn-secondary:hover { border-color: var(--primary); }

    /* ── PRODUCTS LIST ── */
    .products-table { width: 100%; border-collapse: collapse; }
    .products-table th {
      text-align: left; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); padding: 12px 16px; border-bottom: 2px solid var(--border);
    }
    .products-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
    .products-table tr:hover td { background: var(--bg); }
    .tbl-img { width: 52px; height: 66px; object-fit: cover; border-radius: 4px; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .tbl-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .badge-cat {
      padding: 3px 10px; background: var(--accent-light); color: var(--accent);
      border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .5px;
    }
    .action-btns { display: flex; gap: 8px; }
    .edit-btn, .del-btn {
      padding: 6px 14px; border-radius: var(--radius); font-size: 12px;
      cursor: pointer; font-family: 'Inter', sans-serif; border: none; transition: .2s;
    }
    .edit-btn { background: var(--accent-light); color: var(--accent); }
    .edit-btn:hover { background: #eed9b3; }
    .del-btn { background: #ffebee; color: var(--danger); }
    .del-btn:hover { background: #ffcdd2; }

    .list-actions {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .search-input {
      padding: 9px 14px; border: 1px solid var(--border); border-radius: 20px;
      font-size: 13px; width: 240px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .add-new-btn {
      padding: 9px 20px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius); font-size: 13px; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: background .2s;
    }
    .add-new-btn:hover { background: #333; }

    .empty-table { text-align: center; padding: 48px; color: var(--muted); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      padding: 12px 28px; border-radius: 24px; font-size: 14px;
      z-index: 999; transition: transform .3s; white-space: nowrap;
    }
    .toast.success { background: var(--success); color: #fff; }
    .toast.error { background: var(--danger); color: #fff; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── CONFIRM DIALOG ── */
    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 400; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .confirm-overlay.open { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: var(--surface); border-radius: 10px; padding: 32px;
      max-width: 360px; width: 90%; text-align: center;
    }
    .confirm-box h3 { font-size: 18px; margin-bottom: 10px; }
    .confirm-box p { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .confirm-actions { display: flex; gap: 12px; justify-content: center; }
    .confirm-cancel, .confirm-ok {
      padding: 10px 24px; border-radius: var(--radius); font-size: 14px;
      cursor: pointer; font-family: 'Inter', sans-serif; border: none;
    }
    .confirm-cancel { background: var(--bg); border: 1px solid var(--border); }
    .confirm-ok { background: var(--danger); color: #fff; }

    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .admin-header nav .nav-btn { display: none; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">HERMELI</div>
    <p class="login-sub">Panel Administrativo</p>
    <input class="login-input" type="password" id="pwdInput" placeholder="Contraseña" />
    <button class="login-btn" id="loginBtn">Ingresar</button>
    <p class="login-error" id="loginError">Contraseña incorrecta</p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <header class="admin-header">
    <span class="admin-logo">HERMELI</span>
    <nav>
      <button class="nav-btn active" data-section="listSection">📋 Productos</button>
      <button class="nav-btn" data-section="addSection">➕ Agregar</button>
      <a href="index.html" target="_blank" class="nav-btn">🌐 Ver tienda</a>
      <button class="logout-btn" id="logoutBtn">Salir</button>
    </nav>
  </header>

  <div class="admin-body">

    <!-- LIST SECTION -->
    <div class="section active" id="listSection">
      <div class="list-actions">
        <h2 class="section-title" style="margin:0">Mis Productos</h2>
        <div style="display:flex;gap:10px;align-items:center;">
          <input class="search-input" type="text" id="searchInput" placeholder="Buscar producto..." />
          <button class="add-new-btn" onclick="switchSection('addSection')">+ Nuevo</button>
        </div>
      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <div id="productsList"></div>
      </div>
    </div>

    <!-- ADD SECTION -->
    <div class="section" id="addSection">
      <h2 class="section-title" id="formTitle">Agregar Producto</h2>
      <div class="card">
        <div class="form-grid">
          <div class="form-group">
            <label>Nombre del producto *</label>
            <input type="text" id="fName" placeholder="Ej: Blusa Floral Verano" />
          </div>
          <div class="form-group">
            <label>Precio (₲) *</label>
            <input type="number" id="fPrice" placeholder="Ej: 85000" min="0" />
          </div>
          <div class="form-group">
            <label>Categoría *</label>
            <input type="text" id="fCategory" list="categorySuggestions" placeholder="Ej: Vestidos, Blusas, Pantalones..." />
            <datalist id="categorySuggestions">
              <option value="Vestidos"/>
              <option value="Blusas"/>
              <option value="Pantalones"/>
              <option value="Faldas"/>
              <option value="Abrigos"/>
              <option value="Accesorios"/>
              <option value="Ropa Interior"/>
              <option value="Calzado"/>
            </datalist>
          </div>
          <div class="form-group">
            <label>Talles disponibles</label>
            <div class="sizes-input-row" id="sizesRow">
              <input class="size-add-input" type="text" id="sizeInput" placeholder="XS, S, 38..." />
              <button class="size-add-btn" id="addSizeBtn">+ Agregar</button>
            </div>
          </div>
          <div class="form-group full">
            <label>Descripción</label>
            <textarea id="fDesc" placeholder="Describí el producto: tela, corte, colores disponibles..."></textarea>
          </div>
          <div class="form-group full">
            <label>Imagen del producto</label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
              <div>
                <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">📁 Subir desde tu computadora</p>
                <div class="img-preview" id="imgDropZone">
                  <input type="file" id="fImageFile" accept="image/*" />
                  <div id="imgPreviewContent">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#ccc"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span style="font-size:13px;">Clic o arrastrá una imagen</span>
                  </div>
                </div>
              </div>
              <div>
                <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">🔗 O pegá una URL de imagen</p>
                <input type="url" id="fImageUrl" placeholder="https://..." style="width:100%;margin-bottom:8px;" />
                <div id="urlPreview" style="width:100%;height:130px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;">
                  Vista previa
                </div>
              </div>
            </div>
          </div>
        </div>

        <input type="hidden" id="editId" />

        <div class="form-actions">
          <button class="btn-primary" id="saveBtn">💾 Guardar producto</button>
          <button class="btn-secondary" id="clearBtn">Limpiar</button>
          <button class="btn-secondary" onclick="switchSection('listSection')">← Volver</button>
        </div>
      </div>
    </div>

  </div><!-- /admin-body -->
</div><!-- /adminPanel -->

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>¿Eliminar producto?</h3>
    <p>Esta acción no se puede deshacer.</p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancel">Cancelar</button>
      <button class="confirm-ok" id="confirmOk">Eliminar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp
  } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import {
    getStorage, ref as sRef, uploadString, getDownloadURL, deleteObject
  } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

  // ──────────────────────────────────────────
  // 🔧 PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyC3BaoXOQi7ub73nfdH2hDx6uqBnCi8PP8",
    authDomain: "hermeli.firebaseapp.com",
    projectId: "hermeli",
    storageBucket: "hermeli.firebasestorage.app",
    messagingSenderId: "1070236393050",
    appId: "1:1070236393050:web:69dad221f9ff6d60270263",
    measurementId: "G-KC6TSEN24D"
  };
  // 🔒 CAMBIÁ ESTA CONTRASEÑA (solo para el panel admin)
  const ADMIN_PASSWORD = "hermeli2024";
  // ──────────────────────────────────────────

  let app, db, storage;
  let allProducts = [];
  let sizes = [];
  let imageBase64 = '';
  let deleteConfirmId = null;
  let editingId = null;
  let useLocalStorage = false;

  // ── LOGIN ──
  const storedSession = sessionStorage.getItem('hermeli_admin');
  if (storedSession === 'ok') initAdmin();

  document.getElementById('pwdInput').addEventListener('keyup', e => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
  document.getElementById('loginBtn').addEventListener('click', () => {
    const val = document.getElementById('pwdInput').value;
    if (val === ADMIN_PASSWORD) {
      sessionStorage.setItem('hermeli_admin', 'ok');
      initAdmin();
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('pwdInput').value = '';
    }
  });
  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('hermeli_admin');
    location.reload();
  });

  function initAdmin() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';

    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      storage = getStorage(app);
      // Listen to products
      onSnapshot(collection(db, 'productos'), snap => {
        allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderList();
      });
    } catch(e) {
      // Fallback: use localStorage
      useLocalStorage = true;
      allProducts = JSON.parse(localStorage.getItem('hermeli_products') || '[]');
      renderList();
      showToast('Firebase no configurado — usando almacenamiento local', 'error');
    }
  }

  // ── NAV ──
  document.querySelectorAll('[data-section]').forEach(btn => {
    btn.addEventListener('click', () => switchSection(btn.dataset.section));
  });
  window.switchSection = function(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('[data-section]').forEach(b => {
      b.classList.toggle('active', b.dataset.section === id);
    });
    if (id === 'addSection' && !editingId) clearForm();
  };

  // ── RENDER LIST ──
  function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allProducts.filter(p =>
      !q || p.name?.toLowerCase().includes(q) || p.category?.toLowerCase().includes(q)
    );
    const el = document.getElementById('productsList');
    if (!filtered.length) {
      el.innerHTML = `<div class="empty-table"><p>No hay productos todavía.<br/><a href="#" onclick="switchSection('addSection');return false;" style="color:var(--accent);">Agregar el primero</a></p></div>`;
      return;
    }
    el.innerHTML = `
      <table class="products-table">
        <thead>
          <tr>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Talles</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(p => `
            <tr>
              <td><div class="tbl-img">${p.image ? `<img src="${p.image}" alt="" />` : '👗'}</div></td>
              <td><strong>${p.name}</strong></td>
              <td><span class="badge-cat">${p.category || '—'}</span></td>
              <td><strong>₲ ${Number(p.price).toLocaleString('es-PY')}</strong></td>
              <td style="font-size:13px;color:var(--muted);">${(p.sizes||[]).join(', ') || '—'}</td>
              <td>
                <div class="action-btns">
                  <button class="edit-btn" data-id="${p.id}">✏️ Editar</button>
                  <button class="del-btn" data-id="${p.id}">🗑 Eliminar</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;

    el.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => loadEditProduct(btn.dataset.id));
    });
    el.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => confirmDelete(btn.dataset.id));
    });
  }

  document.getElementById('searchInput').addEventListener('input', renderList);

  // ── SIZES ──
  function renderSizes() {
    const row = document.getElementById('sizesRow');
    const tags = sizes.map(s => `
      <span class="size-tag">${s}
        <button data-s="${s}">✕</button>
      </span>`).join('');
    row.innerHTML = tags +
      `<input class="size-add-input" type="text" id="sizeInput" placeholder="XS, S, 38..." />
       <button class="size-add-btn" id="addSizeBtn">+ Agregar</button>`;
    row.querySelectorAll('.size-tag button').forEach(b => {
      b.addEventListener('click', () => { sizes = sizes.filter(s => s !== b.dataset.s); renderSizes(); });
    });
    document.getElementById('addSizeBtn').addEventListener('click', addSize);
    document.getElementById('sizeInput').addEventListener('keyup', e => { if (e.key === 'Enter') addSize(); });
  }
  function addSize() {
    const inp = document.getElementById('sizeInput');
    const vals = inp.value.split(',').map(v => v.trim()).filter(Boolean);
    vals.forEach(v => { if (!sizes.includes(v)) sizes.push(v); });
    inp.value = '';
    renderSizes();
  }
  document.getElementById('addSizeBtn').addEventListener('click', addSize);
  document.getElementById('sizeInput').addEventListener('keyup', e => { if (e.key === 'Enter') addSize(); });

  // ── IMAGE UPLOAD ──
  document.getElementById('fImageFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('La imagen debe pesar menos de 5 MB', 'error'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      imageBase64 = ev.target.result;
      document.getElementById('imgPreviewContent').innerHTML = `<img src="${imageBase64}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;" />`;
      document.getElementById('fImageUrl').value = '';
      document.getElementById('urlPreview').innerHTML = 'Vista previa';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('fImageUrl').addEventListener('input', (e) => {
    const url = e.target.value;
    imageBase64 = '';
    document.getElementById('imgPreviewContent').innerHTML = `
      <div id="imgPreviewContent">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#ccc"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        <span style="font-size:13px;">Clic o arrastrá una imagen</span>
      </div>`;
    if (url) {
      document.getElementById('urlPreview').innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.textContent='URL inválida'" />`;
    } else {
      document.getElementById('urlPreview').innerHTML = 'Vista previa';
    }
  });

  // ── SAVE PRODUCT ──
  document.getElementById('saveBtn').addEventListener('click', saveProduct);

  async function saveProduct() {
    const name = document.getElementById('fName').value.trim();
    const price = document.getElementById('fPrice').value;
    const category = document.getElementById('fCategory').value.trim();
    const description = document.getElementById('fDesc').value.trim();
    const urlInput = document.getElementById('fImageUrl').value.trim();

    if (!name || !price || !category) {
      showToast('Completá nombre, precio y categoría', 'error'); return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Guardando...';

    let imageUrl = urlInput || imageBase64 || '';

    // If base64 + Firebase Storage available, upload
    if (imageBase64 && storage && !useLocalStorage) {
      try {
        const imgRef = sRef(storage, `productos/${Date.now()}`);
        await uploadString(imgRef, imageBase64, 'data_url');
        imageUrl = await getDownloadURL(imgRef);
      } catch(e) {
        imageUrl = imageBase64; // fallback: store as base64
      }
    }

    const data = {
      name, price: Number(price), category, description,
      sizes, image: imageUrl,
      updatedAt: new Date().toISOString()
    };

    try {
      if (editingId) {
        if (!useLocalStorage) {
          await updateDoc(doc(db, 'productos', editingId), data);
        } else {
          const idx = allProducts.findIndex(p => p.id === editingId);
          if (idx >= 0) allProducts[idx] = { ...allProducts[idx], ...data };
          localStorage.setItem('hermeli_products', JSON.stringify(allProducts));
          renderList();
        }
        showToast('Producto actualizado ✓', 'success');
      } else {
        if (!useLocalStorage) {
          await addDoc(collection(db, 'productos'), { ...data, createdAt: serverTimestamp() });
        } else {
          allProducts.push({ id: Date.now().toString(), ...data });
          localStorage.setItem('hermeli_products', JSON.stringify(allProducts));
          renderList();
        }
        showToast('Producto agregado ✓', 'success');
      }
      clearForm();
      switchSection('listSection');
    } catch(e) {
      showToast('Error al guardar: ' + e.message, 'error');
    }
    btn.disabled = false; btn.textContent = '💾 Guardar producto';
  }

  // ── EDIT ──
  function loadEditProduct(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('editId').value = id;
    document.getElementById('fName').value = p.name || '';
    document.getElementById('fPrice').value = p.price || '';
    document.getElementById('fCategory').value = p.category || '';
    document.getElementById('fDesc').value = p.description || '';
    sizes = [...(p.sizes || [])];
    imageBase64 = '';
    if (p.image) {
      if (p.image.startsWith('data:')) {
        imageBase64 = p.image;
        document.getElementById('imgPreviewContent').innerHTML = `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;" />`;
      } else {
        document.getElementById('fImageUrl').value = p.image;
        document.getElementById('urlPreview').innerHTML = `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;" />`;
      }
    }
    renderSizes();
    document.getElementById('formTitle').textContent = 'Editar Producto';
    switchSection('addSection');
  }

  // ── CLEAR FORM ──
  document.getElementById('clearBtn').addEventListener('click', clearForm);
  function clearForm() {
    editingId = null;
    document.getElementById('fName').value = '';
    document.getElementById('fPrice').value = '';
    document.getElementById('fCategory').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fImageUrl').value = '';
    document.getElementById('editId').value = '';
    document.getElementById('formTitle').textContent = 'Agregar Producto';
    sizes = [];
    imageBase64 = '';
    renderSizes();
    document.getElementById('imgPreviewContent').innerHTML = `
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#ccc"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span style="font-size:13px;">Clic o arrastrá una imagen</span>`;
    document.getElementById('urlPreview').innerHTML = 'Vista previa';
  }

  // ── DELETE ──
  function confirmDelete(id) {
    deleteConfirmId = id;
    document.getElementById('confirmOverlay').classList.add('open');
  }
  document.getElementById('confirmCancel').addEventListener('click', () => {
    document.getElementById('confirmOverlay').classList.remove('open');
    deleteConfirmId = null;
  });
  document.getElementById('confirmOk').addEventListener('click', async () => {
    if (!deleteConfirmId) return;
    document.getElementById('confirmOverlay').classList.remove('open');
    try {
      if (!useLocalStorage) {
        await deleteDoc(doc(db, 'productos', deleteConfirmId));
      } else {
        allProducts = allProducts.filter(p => p.id !== deleteConfirmId);
        localStorage.setItem('hermeli_products', JSON.stringify(allProducts));
        renderList();
      }
      showToast('Producto eliminado', 'success');
    } catch(e) {
      showToast('Error al eliminar', 'error');
    }
    deleteConfirmId = null;
  });

  // ── TOAST ──
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
